server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  http:
    codecs:
      max-in-memory-size: ${GATEWAY_MAX_BODY_BYTES:1048576}
  reactor:
    context-propagation: auto
  security:
    oauth2:
      resourceserver:
        jwt:
          # Igual que en los servicios: se valida el emisor publico y las claves se bajan por la red interna
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/adopciones}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/adopciones/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 15s
          # Las rutas publicas no se reescriben (CONTRATOS.md, seccion 2). /internal/** no tiene ruta.
          routes:
            - id: animales
              uri: ${ANIMALES_URL:http://localhost:8081}
              predicates:
                - Path=/api/animales/**
            - id: adopciones
              uri: ${ADOPCIONES_URL:http://localhost:8082}
              predicates:
                - Path=/api/adoptantes/**,/api/solicitudes/**
            - id: donaciones
              uri: ${DONACIONES_URL:http://localhost:8083}
              predicates:
                - Path=/api/donaciones/**

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

gateway:
  seguridad:
    cors-allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}
    max-body-bytes: ${GATEWAY_MAX_BODY_BYTES:1048576}
    jwt-clock-skew: ${JWT_CLOCK_SKEW:30s}
    jwt-allowed-clients: ${GATEWAY_JWT_ALLOWED_CLIENTS:tpi-client,adopciones-pkce}
    jwt-required-audience: ${JWT_REQUIRED_AUDIENCE:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [gateway] [%X{correlationId}] %logger{36} - %msg%n"
