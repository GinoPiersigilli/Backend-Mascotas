version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - maven
    # CONTRATOS.md y maven-enforcer-plugin fijan Java 21 y la serie Spring Boot 3.5.x
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "net.javacrumbs.shedlock:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: "/ms-animales"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        versions: ["*-eclipse-temurin-22*", "*-eclipse-temurin-23*", "*-eclipse-temurin-24*", "*-eclipse-temurin-25*", "*-eclipse-temurin-26*"]

  - package-ecosystem: docker
    directory: "/ms-adopciones"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        versions: ["*-eclipse-temurin-22*", "*-eclipse-temurin-23*", "*-eclipse-temurin-24*", "*-eclipse-temurin-25*", "*-eclipse-temurin-26*"]

  - package-ecosystem: docker
    directory: "/ms-donaciones"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        versions: ["*-eclipse-temurin-22*", "*-eclipse-temurin-23*", "*-eclipse-temurin-24*", "*-eclipse-temurin-25*", "*-eclipse-temurin-26*"]

  - package-ecosystem: docker
    directory: "/gateway"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        versions: ["*-eclipse-temurin-22*", "*-eclipse-temurin-23*", "*-eclipse-temurin-24*", "*-eclipse-temurin-25*", "*-eclipse-temurin-26*"]
