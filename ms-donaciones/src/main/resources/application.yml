server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: ms-donaciones
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/tpi}
    username: ${DB_USER:donaciones_user}
    password: ${DB_PASSWORD:donaciones_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    default-schema: donaciones
    schemas:
      - donaciones
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: donaciones
        default_batch_fetch_size: 50
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/adopciones}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/adopciones/protocol/openid-connect/certs}

donaciones:
  monto-minimo: ${DONACION_MONTO_MINIMO:1}
  mercado-pago:
    base-url: ${MP_BASE_URL:https://api.mercadopago.com}
    # Solo la credencial de la cuenta VENDEDORA DE PRUEBA. Nunca se versiona.
    access-token: ${MP_ACCESS_TOKEN:sin-configurar}
    # Secreto HMAC-SHA256 del panel de Webhooks de Mercado Pago (x-signature). Nunca se versiona.
    webhook-secret: ${MP_WEBHOOK_SECRET:sin-configurar}
    connect-timeout: ${MP_CONNECT_TIMEOUT:2s}
    read-timeout: ${MP_READ_TIMEOUT:5s}
    usar-sandbox-init-point: ${MP_USAR_SANDBOX_INIT_POINT:false}
    titulo-item: "Donacion al refugio"
    circuit-breaker:
      failure-rate-threshold: ${MP_CB_FAILURE_RATE:50}
      sliding-window-size: ${MP_CB_SLIDING_WINDOW:10}
      minimum-number-of-calls: ${MP_CB_MIN_CALLS:5}
      wait-duration-in-open-state: ${MP_CB_WAIT_OPEN:30s}
      permitted-number-of-calls-in-half-open-state: ${MP_CB_HALF_OPEN_CALLS:2}
    retry:
      max-attempts: ${MP_RETRY_MAX_ATTEMPTS:3}
      wait-duration: ${MP_RETRY_WAIT:200ms}
  tareas:
    habilitadas: ${DONACIONES_TAREAS_HABILITADAS:true}
    demora-inicial-ms: ${DONACIONES_RECONCILIACION_DEMORA_INICIAL_MS:60000}
    intervalo-ms: ${DONACIONES_RECONCILIACION_INTERVALO_MS:300000}
    antiguedad-minima: ${DONACIONES_RECONCILIACION_ANTIGUEDAD_MINIMA:5m}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

seguridad:
  jwt:
    clock-skew: ${JWT_CLOCK_SKEW:30s}
    allowed-clients: ${JWT_ALLOWED_CLIENTS:tpi-client,adopciones-pkce,adopciones-service}
    required-audience: ${JWT_REQUIRED_AUDIENCE:}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [ms-donaciones] [%X{correlationId}] %logger{36} - %msg%n"
