server:
  port: 8082

spring:
  application:
    name: ms-adopciones
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/tpi}
    username: ${DB_USER:adopciones_user}
    password: ${DB_PASSWORD:adopciones_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    default-schema: adopciones
    schemas:
      - adopciones
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: adopciones
        default_batch_fetch_size: 50
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/adopciones}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/adopciones/protocol/openid-connect/certs}

adopciones:
  politica:
    refugio-lat: ${REFUGIO_LAT:-31.4334}
    refugio-lon: ${REFUGIO_LON:-64.1918}
    distancia-max-km: ${DISTANCIA_MAX_KM:100}
    plazo-entrega-dias: ${PLAZO_ENTREGA_DIAS:7}
    periodo-adaptacion-dias: ${PERIODO_ADAPTACION_DIAS:30}
  integraciones:
    animales:
      base-url: ${ANIMALES_URL:http://localhost:8081}
      connect-timeout: ${ANIMALES_CONNECT_TIMEOUT:2s}
      read-timeout: ${ANIMALES_READ_TIMEOUT:3s}
      circuit-breaker:
        failure-rate-threshold: ${ANIMALES_CB_FAILURE_RATE:50}
        sliding-window-size: ${ANIMALES_CB_SLIDING_WINDOW:10}
        minimum-number-of-calls: ${ANIMALES_CB_MIN_CALLS:5}
        wait-duration-in-open-state: ${ANIMALES_CB_WAIT_OPEN:15s}
        permitted-number-of-calls-in-half-open-state: ${ANIMALES_CB_HALF_OPEN_CALLS:2}
    keycloak:
      token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/adopciones/protocol/openid-connect/token}
      client-id: ${ADOPCIONES_SERVICE_CLIENT_ID:adopciones-service}
      client-secret: ${ADOPCIONES_SERVICE_CLIENT_SECRET:cambiar}
      connect-timeout: ${KEYCLOAK_CONNECT_TIMEOUT:2s}
      read-timeout: ${KEYCLOAK_READ_TIMEOUT:3s}
    georef:
      base-url: ${GEOREF_BASE_URL:https://apis.datos.gob.ar/georef/api/v2.0}
      connect-timeout: ${GEOREF_CONNECT_TIMEOUT:2s}
      read-timeout: ${GEOREF_READ_TIMEOUT:4s}
      circuit-breaker:
        failure-rate-threshold: ${GEOREF_CB_FAILURE_RATE:50}
        sliding-window-size: ${GEOREF_CB_SLIDING_WINDOW:10}
        minimum-number-of-calls: ${GEOREF_CB_MIN_CALLS:5}
        wait-duration-in-open-state: ${GEOREF_CB_WAIT_OPEN:30s}
        permitted-number-of-calls-in-half-open-state: ${GEOREF_CB_HALF_OPEN_CALLS:2}
      retry:
        max-attempts: ${GEOREF_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${GEOREF_RETRY_WAIT:200ms}
  tareas:
    habilitadas: ${TAREAS_HABILITADAS:true}
    demora-inicial-ms: ${VENCIMIENTOS_DEMORA_INICIAL_MS:60000}
    intervalo-ms: ${VENCIMIENTOS_INTERVALO_MS:300000}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [ms-adopciones] [%X{correlationId}] %logger{36} - %msg%n"
